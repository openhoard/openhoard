name: ci
on:
  push:
    branches: [main]
  pull_request:
  # Windows and macOS run every suite here and on main; on a pull request only when it touches
  # what can differ by OS (the node job's "Scope" step).
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  node:
    name: node (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request is checked out as a merge commit: HEAD^1 is the base, so the Scope
          # step can list what the pull request changes.
          fetch-depth: 2
      # T-1409. Ubuntu runs everything every time. Windows and macOS run the suites on main, on
      # the nightly schedule, and on a pull request that changes the toolchain or code that
      # behaves differently by OS (paths, child processes, file watching, the solo commands, or
      # any source file that names a platform; a test naming one only for a longer timeout on
      # Windows doesn't count). Otherwise they only report: the checks are required, so the job
      # always runs and its steps are skipped.
      - name: Scope
        id: scope
        shell: bash
        env:
          OS: ${{ matrix.os }}
          EVENT: ${{ github.event_name }}
        run: |
          full=true
          if [ "$OS" != ubuntu-latest ] && [ "$EVENT" = pull_request ]; then
            changed=$(git diff --name-only HEAD^1 HEAD)
            os_paths='^(\.github/workflows/|\.nvmrc$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|turbo\.json$|packages/config/|connectors/fs/|core/storage/|core/db/src/(pglite|driver)|enrichers/extract/|apps/server/src/(watch|pin|solo|connect|tunnel|main|service)|apps/cli/src/(operator|bin)|scripts/)'
            platform_words='process\.platform|win32|darwin|pathToFileURL|fileURLToPath'
            named=""
            for f in $changed; do
              case "$f" in *.test.*) continue ;; *.ts | *.tsx | *.js | *.mjs) ;; *) continue ;; esac
              if [ -f "$f" ] && grep -Eq "$platform_words" "$f"; then named="$f"; break; fi
            done
            if grep -Eq "$os_paths" <<<"$changed"; then
              echo "OS-specific paths changed"
            elif [ -n "$named" ]; then
              echo "$named names a platform"
            else
              full=false
              echo "Nothing OS-specific changed: the suites run on ubuntu only."
            fi
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.scope.outputs.full == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.scope.outputs.full == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.scope.outputs.full == 'true'
      # Lint, formatting and generated files don't depend on the OS: once, on ubuntu.
      - run: pnpm lint
        if: matrix.os == 'ubuntu-latest'
      - run: pnpm format:check
        if: matrix.os == 'ubuntu-latest'
      - run: pnpm build
        if: steps.scope.outputs.full == 'true'
      - run: pnpm typecheck
        if: steps.scope.outputs.full == 'true'
      # The fast suites only (the slow lane runs in the postgres job). Coverage (a tripwire, not
      # a target) once, on ubuntu. Every database suite starts PGlite (WASM), so run few suites
      # at once: ubuntu runners have four cores (turbo's default of 10 timed out suites' 60 s
      # setup under coverage), macOS ones three and Windows ones four, slow ones.
      - run: pnpm test:coverage --concurrency=3
        if: matrix.os == 'ubuntu-latest'
      - run: pnpm test ${{ matrix.os == 'macos-latest' && '--concurrency=2' || '--concurrency=3' }}
        if: matrix.os != 'ubuntu-latest' && steps.scope.outputs.full == 'true'
      - name: Generated types are up to date
        if: matrix.os == 'ubuntu-latest'
        run: |
          pnpm --filter @openhoard/schemas run generate
          git diff --exit-code -- packages/schemas/src/generated
      - name: Database migrations match the schema
        if: matrix.os == 'ubuntu-latest'
        run: |
          pnpm --filter @openhoard/core-db run db:generate
          git status --porcelain -- core/db/migrations
          test -z "$(git status --porcelain -- core/db/migrations)"
      - name: CLI smoke test
        if: steps.scope.outputs.full == 'true'
        shell: bash
        run: |
          node apps/cli/dist/bin.js manifest validate connectors/example/openhoard.plugin.json
          # `serve` starts the server (whose entry point Windows imports only as a file: URL).
          dir="$RUNNER_TEMP/openhoard-smoke"
          mkdir -p "$dir/files"
          node apps/cli/dist/bin.js --data-dir "$dir/data" init --solo --folder "$dir/files" --no-pin --no-extract > /dev/null
          OPENHOARD_PORT=7431 node apps/cli/dist/bin.js --data-dir "$dir/data" serve &
          for _ in $(seq 60); do curl -fsS http://127.0.0.1:7431/healthz > /dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:7431/healthz
          kill $! || true
      # T-1102: the server as this OS's service (systemd, launchd, Task Scheduler), for real:
      # installed, answering, stopped, started again, removed. A reboot isn't tried here.
      - name: Service install
        if: steps.scope.outputs.full == 'true'
        shell: bash
        run: |
          dir="$RUNNER_TEMP/openhoard-service"
          mkdir -p "$dir/files"
          node apps/cli/dist/bin.js --data-dir "$dir/data" init --solo --folder "$dir/files" --no-pin --no-extract > /dev/null
          # Windows runners are administrators; elsewhere sudo, which passes the port on.
          if [ "$RUNNER_OS" = Windows ]; then export OPENHOARD_PORT=7432; as=(); else as=(sudo OPENHOARD_PORT=7432); fi
          svc() { "${as[@]}" "$(command -v node)" apps/cli/dist/bin.js --data-dir "$dir/data" service "$@"; }
          up() { for _ in $(seq 60); do curl -fsS http://127.0.0.1:7432/healthz > /dev/null 2>&1 && return 0; sleep 1; done; return 1; }
          logs() { svc status || true; if [ "$RUNNER_OS" = Linux ]; then sudo journalctl -u openhoard --no-pager | tail -50; else cat "$dir/data/logs/server.log"; fi; }
          svc install
          up || { logs; exit 1; }
          svc stop
          # Stopped cleanly: the server let go of the embedded database (a killed one leaves its lock).
          for _ in $(seq 20); do [ -e "$dir/data/pgdata.lock" ] || break; sleep 1; done
          if [ -e "$dir/data/pgdata.lock" ]; then echo "the server didn't stop cleanly"; logs; exit 1; fi
          if curl -fsS http://127.0.0.1:7432/healthz; then echo "still answering after stop"; logs; exit 1; fi
          svc start
          up || { logs; exit 1; }
          svc uninstall
      # T-017: per-file outcomes for the prompt-injection corpus, in the job summary. The v0
      # baseline pipeline cannot act or tag, so today this is a smoke test of the corpus and the
      # extractor (it fails if either crashes). It becomes a real gate when enrichers plug in.
      - name: Prompt-injection corpus report
        if: matrix.os == 'ubuntu-latest'
        run: pnpm --filter @openhoard/testkit run injection:report

  # The database suites (core-db, core-audit, core-catalog, core-identity, core-jobs, ai-enrich, server) on native PostgreSQL 18 (ADR-0004, spike S2); the
  # node jobs run them on PGlite. They connect as an ordinary role, as production must. PGDG
  # packages, no Docker.
  postgres:
    name: postgres (18)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install PostgreSQL 18 and pgvector
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-18 postgresql-18-pgvector
      # pgvector isn't a trusted extension: the superuser creates it once, in a template the
      # ordinary user's test databases are copied from (core/db testing-postgres.ts).
      - name: Start a cluster, create an ordinary (non-superuser) user and the test template
        run: |
          sudo pg_createcluster 18 ci --port 5499 --start
          sudo -u postgres psql -p 5499 -v ON_ERROR_STOP=1 \
            -c "create role openhoard_ci login createdb password 'ci'" \
            -c "create database openhoard_test_template template template0 encoding 'UTF8' locale_provider builtin builtin_locale 'C.UTF-8'" \
            -c "alter database openhoard_test_template is_template true"
          sudo -u postgres psql -p 5499 -d openhoard_test_template -v ON_ERROR_STOP=1 \
            -c "create extension vector"
      - run: pnpm install --frozen-lockfile
      # Workspace packages the suites import are used from their build output (through turbo,
      # so the slow lane below finds them built).
      - run: pnpm build
      - run: pnpm --filter @openhoard/core-db run test
        env:
          OPENHOARD_TEST_POSTGRES_URL: postgres://openhoard_ci:ci@localhost:5499/postgres
      - run: pnpm --filter @openhoard/core-audit run test
        env:
          OPENHOARD_TEST_POSTGRES_URL: postgres://openhoard_ci:ci@localhost:5499/postgres
      - run: pnpm --filter @openhoard/core-catalog run test
        env:
          OPENHOARD_TEST_POSTGRES_URL: postgres://openhoard_ci:ci@localhost:5499/postgres
      - run: pnpm --filter @openhoard/core-identity run test
        env:
          OPENHOARD_TEST_POSTGRES_URL: postgres://openhoard_ci:ci@localhost:5499/postgres
      - run: pnpm --filter @openhoard/core-jobs run test
        env:
          OPENHOARD_TEST_POSTGRES_URL: postgres://openhoard_ci:ci@localhost:5499/postgres
      - run: pnpm --filter @openhoard/ai-enrich run test
        env:
          OPENHOARD_TEST_POSTGRES_URL: postgres://openhoard_ci:ci@localhost:5499/postgres
      - run: pnpm --filter @openhoard/server run test
        env:
          OPENHOARD_TEST_POSTGRES_URL: postgres://openhoard_ci:ci@localhost:5499/postgres
      # The slow lane (packages/config/vitest.preset.js): every `*.slow.test.ts` suite, once,
      # here. The heavy suites (the leak harness, the injection corpus, the 10,000-item
      # SharePoint tenant, the 1 GiB CSV, vector recall) and the frozen solo track's.
      - run: pnpm test:slow
        env:
          OPENHOARD_TEST_POSTGRES_URL: postgres://openhoard_ci:ci@localhost:5499/postgres
