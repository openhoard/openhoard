name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  node:
    name: node (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm typecheck
      # macOS runners have three cores, and every database suite starts PGlite (WASM) per test:
      # run fewer suites at once there, or setup hooks time out.
      - run: pnpm test:coverage ${{ matrix.os == 'macos-latest' && '--concurrency=2' || '' }}
      - name: Generated types are up to date
        run: |
          pnpm --filter @openhoard/schemas run generate
          git diff --exit-code -- packages/schemas/src/generated
      - name: Database migrations match the schema
        if: matrix.os == 'ubuntu-latest'
        run: |
          pnpm --filter @openhoard/core-db run db:generate
          git status --porcelain -- core/db/migrations
          test -z "$(git status --porcelain -- core/db/migrations)"
      - name: CLI smoke test
        run: node apps/cli/dist/bin.js manifest validate connectors/example/openhoard.plugin.json
      # T-017: per-file outcomes for the prompt-injection corpus, in the job summary. The v0
      # baseline pipeline cannot act or tag, so today this is a smoke test of the corpus and the
      # extractor (it fails if either crashes). It becomes a real gate when enrichers plug in.
      - name: Prompt-injection corpus report
        if: matrix.os == 'ubuntu-latest'
        run: pnpm --filter @openhoard/testkit run injection:report

  # The database suites (core-db, core-audit, core-catalog, core-identity, core-jobs, server) on native PostgreSQL 18 (ADR-0004, spike S2); the
  # node jobs run them on PGlite. They connect as an ordinary role, as production must. PGDG
  # packages, no Docker.
  postgres:
    name: postgres (18)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install PostgreSQL 18 and pgvector
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-18 postgresql-18-pgvector
      - name: Start a cluster and create an ordinary (non-superuser) user
        run: |
          sudo pg_createcluster 18 ci --port 5499 --start
          sudo -u postgres psql -p 5499 -v ON_ERROR_STOP=1 \
            -c "create role openhoard_ci login createdb password 'ci'"
      - run: pnpm install --frozen-lockfile
      # Workspace packages the suites import are used from their build output.
      - run: >-
          pnpm --filter "@openhoard/core-audit^..." --filter "@openhoard/core-catalog^..."
          --filter "@openhoard/core-identity^..." --filter "@openhoard/core-jobs^..."
          --filter "@openhoard/server^..." --filter "@openhoard/enricher-extract^..." run build
      - run: pnpm --filter @openhoard/core-db run test:coverage
        env:
          OPENHOARD_TEST_POSTGRES_URL: postgres://openhoard_ci:ci@localhost:5499/postgres
      - run: pnpm --filter @openhoard/core-audit run test:coverage
        env:
          OPENHOARD_TEST_POSTGRES_URL: postgres://openhoard_ci:ci@localhost:5499/postgres
      - run: pnpm --filter @openhoard/core-catalog run test:coverage
        env:
          OPENHOARD_TEST_POSTGRES_URL: postgres://openhoard_ci:ci@localhost:5499/postgres
      - run: pnpm --filter @openhoard/core-identity run test:coverage
        env:
          OPENHOARD_TEST_POSTGRES_URL: postgres://openhoard_ci:ci@localhost:5499/postgres
      - run: pnpm --filter @openhoard/core-jobs run test:coverage
        env:
          OPENHOARD_TEST_POSTGRES_URL: postgres://openhoard_ci:ci@localhost:5499/postgres
      - run: pnpm --filter @openhoard/server run test:coverage
        env:
          OPENHOARD_TEST_POSTGRES_URL: postgres://openhoard_ci:ci@localhost:5499/postgres
      # T-402's done-when: a 1 GiB CSV streams through the extractor's child process with flat
      # memory and an exact row count (about a minute; the node jobs run it at 32 MiB).
      - run: pnpm --filter @openhoard/enricher-extract run test:slow

  python-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/cli-py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Schema copy matches canonical schema
        run: diff -u ../../packages/schemas/src/plugin-manifest.v1.schema.json src/openhoard/schemas/plugin-manifest.v1.schema.json
      # Every dependency, including the build backend, is hash-pinned (Scorecard Pinned-Dependencies).
      # Regenerate requirements-ci.txt with the command in requirements-ci.in.
      - run: python -m pip install --require-hashes --no-deps -r requirements-ci.txt
      - run: python -m pip install --no-deps --no-build-isolation .
      - run: python -m pip check
      - run: python -m pytest -q
