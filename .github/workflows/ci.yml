name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cli-js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cli-js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - name: Validate example manifests
        run: node bin/openhoard.js manifest validate ../../connectors/example/openhoard.plugin.json

  cli-py:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cli-py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Schema copy matches canonical schema
        run: diff -u ../../schemas/plugin-manifest.v1.schema.json src/openhoard/schemas/plugin-manifest.v1.schema.json
      - run: python -m pip install -e . pytest
      - run: pytest -q
