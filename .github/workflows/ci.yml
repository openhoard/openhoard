name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  node:
    name: node (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - name: Generated types are up to date
        run: |
          pnpm --filter @openhoard/schemas run generate
          git diff --exit-code -- packages/schemas/src/generated
      - name: CLI smoke test
        run: node apps/cli/dist/bin.js manifest validate connectors/example/openhoard.plugin.json
      # T-017: per-file outcomes for the prompt-injection corpus, in the job summary. Fails only if
      # a file makes the pipeline act or loosen access (or crash); leaks into cards are reported.
      - name: Prompt-injection corpus report
        if: matrix.os == 'ubuntu-latest'
        run: pnpm --filter @openhoard/testkit run injection:report

  python-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/cli-py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Schema copy matches canonical schema
        run: diff -u ../../packages/schemas/src/plugin-manifest.v1.schema.json src/openhoard/schemas/plugin-manifest.v1.schema.json
      # Every dependency, including the build backend, is hash-pinned (Scorecard Pinned-Dependencies).
      # Regenerate requirements-ci.txt with the command in requirements-ci.in.
      - run: python -m pip install --require-hashes --no-deps -r requirements-ci.txt
      - run: python -m pip install --no-deps --no-build-isolation .
      - run: python -m pip check
      - run: python -m pytest -q
