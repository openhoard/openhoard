name: pr-hygiene
on:
  pull_request:

permissions:
  contents: read

jobs:
  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Conventional Commits
        run: pnpm exec commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}"
      - name: DCO sign-off on every commit
        run: |
          missing=0
          for c in $(git rev-list "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"); do
            author=$(git log -1 --format='%ae' "$c")
            if ! git log -1 --format='%B' "$c" | grep -qiE "^Signed-off-by: .+<${author}>$"; then
              echo "::error::Commit $c is missing 'Signed-off-by' matching its author ($author). Use git commit -s."
              missing=1
            fi
          done
          exit $missing
      - name: Changeset present (informational)
        continue-on-error: true
        run: pnpm exec changeset status --since=origin/${{ github.base_ref }}
