name: pr-hygiene
on:
  pull_request:

permissions:
  contents: read

jobs:
  commits:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # PR data is passed through env, never interpolated straight into shell (script-injection hardening).
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Conventional Commits
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA"
      - name: DCO sign-off on every human commit
        run: |
          missing=0
          for c in $(git rev-list "$BASE_SHA..$HEAD_SHA"); do
            name=$(git log -1 --format='%an' "$c")
            # Bots (Dependabot, GitHub Actions) can't sign the DCO; their changes are reviewed on merge.
            case "$name" in *"[bot]") continue ;; esac
            author=$(git log -1 --format='%ae' "$c")
            # Compare as a fixed string: emails such as 123+name@users.noreply.github.com contain
            # regex metacharacters. Only real trailers count, not "Signed-off-by" in the body text.
            if ! git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$c" | grep -qF -- "<${author}>"; then
              echo "::error::Commit $c is missing 'Signed-off-by' matching its author ($author). Use git commit -s."
              missing=1
            fi
          done
          exit $missing
      - name: Changeset present (informational)
        continue-on-error: true
        run: pnpm exec changeset status --since="origin/$BASE_REF"

  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          # Apache-2.0 project: block strong-copyleft dependencies from entering the core.
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, SSPL-1.0
