<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">OpenHoard</title>
  <desc id="d">OpenHoard logo: a watchful dragon eye inside a hexagonal gem, with the tagline "The AI filesystem that remembers everything and guards it all."</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15110D"/>
      <stop offset="1" stop-color="#2A1E13"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7C85C"/>
      <stop offset="1" stop-color="#D98A1F"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE39A"/>
      <stop offset="0.7" stop-color="#F2A93B"/>
      <stop offset="1" stop-color="#B8651A"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>

  <!-- emblem -->
  <g transform="translate(170 160)">
    <!-- hoard gem (hexagon) -->
    <polygon points="0,-118 102,-59 102,59 0,118 -102,59 -102,-59" fill="none" stroke="url(#gold)" stroke-width="10" stroke-linejoin="round"/>
    <polygon points="0,-96 83,-48 83,48 0,96 -83,48 -83,-48" fill="#1E1711" stroke="#F2A93B" stroke-opacity="0.35" stroke-width="2"/>
    <!-- facets -->
    <path d="M0,-96 L0,-58 M83,-48 L50,-29 M83,48 L50,29 M0,96 L0,58 M-83,48 L-50,29 M-83,-48 L-50,-29" stroke="#F2A93B" stroke-opacity="0.35" stroke-width="2"/>
    <!-- dragon eye -->
    <path d="M-66,0 C-40,-44 40,-44 66,0 C40,44 -40,44 -66,0 Z" fill="url(#iris)" stroke="#FFD27A" stroke-width="3"/>
    <ellipse cx="0" cy="0" rx="8" ry="34" fill="#120C07"/>
    <circle cx="-16" cy="-14" r="6" fill="#FFF6DA" opacity="0.85"/>
  </g>

  <!-- wordmark -->
  <text x="330" y="160" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="96" font-weight="800" letter-spacing="-2" fill="#FFFFFF">Open<tspan fill="url(#gold)">Hoard</tspan></text>
  <text x="334" y="214" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="500" fill="#EDE3D1">The AI filesystem that remembers everything and guards it all.</text>
  <text x="334" y="258" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="3" fill="#F2A93B">NO FOLDERS · JUST ASK · EVERY FILE GOVERNED</text>
</svg>
